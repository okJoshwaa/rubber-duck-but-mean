<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rubber Duck, But Mean</title>
<meta name="description" content="A rubber-duck debugging companion that pushes back on vague explanations instead of just sitting there." />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <div class="app">
    <header class="hero">
      <div class="duck-avatar" id="duckAvatar" aria-hidden="true">
        <svg viewBox="0 0 140 130" width="104" height="104">
          <defs>
            <linearGradient id="duckBodyGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffe28a" />
              <stop offset="100%" stop-color="#ffc93c" />
            </linearGradient>
            <linearGradient id="duckBillGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ff9f43" />
              <stop offset="100%" stop-color="#e8770f" />
            </linearGradient>
          </defs>
          <ellipse class="duck-tail" cx="22" cy="92" rx="18" ry="14" />
          <ellipse class="duck-body" cx="68" cy="94" rx="50" ry="34" />
          <path class="duck-wing" d="M 30 100 Q 68 118 108 98" />
          <circle class="duck-head" cx="92" cy="48" r="32" />
          <ellipse class="duck-shine" cx="80" cy="35" rx="10" ry="6" />
          <path class="duck-bill" d="M 106 46 Q 128 42 130 54 Q 128 66 106 60 Q 100 53 106 46 Z" />
          <path class="duck-bill-line" d="M 108 53 L 126 53" />
          <g class="duck-eyes">
            <circle class="duck-eye-white" id="eyeWhiteL" cx="82" cy="38" r="12" />
            <ellipse class="duck-eye" id="eyeL" cx="86" cy="39" rx="6" ry="6" />
            <circle class="duck-eye-shine" cx="88" cy="37" r="2" />
          </g>
          <ellipse class="duck-blush" cx="88" cy="62" rx="8" ry="5" />
          <g class="duck-brow" id="browGroup" opacity="0">
            <path d="M 72 24 Q 82 16 92 22" />
          </g>
        </svg>
      </div>
      <h1>Rubber Duck, But Mean</h1>
      <p class="tagline">Explain your bug. It won't just nod along.</p>
      <div class="skepticism-wrap">
        <span class="skepticism-label">Skepticism</span>
        <div class="skepticism-bar"><div id="skepticismFill" class="skepticism-fill"></div></div>
      </div>
    </header>

    <main class="chat-card">
      <div id="chatLog" class="chat-log">
        <div class="msg duck">
          <div class="bubble">Alright. What are you debugging?</div>
        </div>
      </div>

      <form id="chatForm" class="chat-input-row">
        <textarea id="chatInput" rows="2" placeholder="My function returns undefined sometimes..." autofocus></textarea>
        <button type="submit" class="send-btn" aria-label="Send">Send</button>
      </form>
    </main>

    <footer class="foot">
      Fully rule-based, runs in your browser. No API, nothing you type leaves this page.
      <button id="resetBtn" class="reset-link" type="button">Start over</button>
    </footer>
  </div>

  <script src="particles.js"></script>
  <script src="script.js"></script>
</body>
</html>
